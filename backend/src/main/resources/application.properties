server.port=8080

# Firebase — download credentials JSON from Firebase Console -> Project Settings -> Service Accounts
# Locally this reads backend/firebase-credentials.json; on Render it's a mounted Secret File.
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:firebase-credentials.json}
firebase.project.id=${FIREBASE_PROJECT_ID:job-scraper-39498}

# Secret key your Python scraper sends with every POST /api/jobs request.
# No local default on purpose — must be set via env var (see scraper/.env for the local value).
app.scraper.api-key=${SCRAPER_API_KEY}

# Comma-separated list of origins allowed to call /api/**. Add your deployed frontend URL here.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Max requests per minute per IP (for read endpoints)
app.rate-limit.requests-per-minute=200

logging.level.com.jobtracker=DEBUG

# Only used when running the scraper via the "Run Scraper" button — that only works when
# the backend runs on the same machine as the scraper (local dev), not on Render.
scraper.python.path=${SCRAPER_PYTHON_PATH:D:/coding/job scraper app/scraper/venv/Scripts/python.exe}
scraper.working.dir=${SCRAPER_WORKING_DIR:D:/coding/job scraper app/scraper}
scraper.script=main.py
